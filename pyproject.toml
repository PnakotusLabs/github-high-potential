[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "github-high-potential"
version = "0.1.0"
description = "Half-day AI high-potential GitHub project discovery workflow."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
]

[project.scripts]
github-high-potential = "github_high_potential.main:app"

[tool.setuptools.packages.find]
where = ["src"]
